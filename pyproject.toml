[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron"
version = "0.1.0"
description = "Fantasy football projections as distributions, with honest walk-forward backtests and a sequential draft optimizer."
requires-python = ">=3.10"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: fits many quantile models; excluded from the fast CI run",
]

[tool.ruff]
line-length = 100
target-version = "py310"
